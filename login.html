<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fin-Plast International — Admin Giriş</title>
  <meta name="description" content="Fin-Plast International idarəetmə mərkəzinə giriş səhifəsi.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/logo.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/api.js"></script>

  <!-- Login Stylesheet -->
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <!-- Background Glow Orb -->
  <div class="login-bg-glow"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo-wrap">
          <img src="assets/images/finplast_logo_official.png" alt="Fin-Plast International Logo" />
        </div>
        <h1 class="login-title">Fin-Plast CMS</h1>
        <p class="login-subtitle">İdarəetmə Panelinə daxil olun</p>
      </div>

      <!-- Error Alert Box -->
      <div class="login-alert" id="loginAlert">
        <i data-lucide="alert-circle" style="width: 18px; height: 18px; flex-shrink: 0;"></i>
        <span id="loginAlertMsg">İstifadəçi adı və ya şifrə yanlışdır!</span>
      </div>

      <form class="login-form" id="loginForm">
        <div class="form-group">
          <label class="form-label" for="usernameInput">İstifadəçi Adı</label>
          <div class="input-wrap">
            <i data-lucide="user" class="input-icon"></i>
            <input type="text" id="usernameInput" class="form-input" value="admin" required placeholder="İstifadəçi adınız..." autofocus />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">
            <span>Şifrə</span>
          </label>
          <div class="input-wrap">
            <i data-lucide="lock" class="input-icon"></i>
            <input type="password" id="passwordInput" class="form-input" value="finplast2026" required placeholder="Şifrəniz..." />
            <button type="button" class="toggle-pwd" id="togglePwdBtn" aria-label="Şifrəni göstər">
              <i data-lucide="eye" id="eyeIcon" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked />
            <span>Məni xatırla</span>
          </label>
          <span style="font-size: 0.8rem; color: #94a3b8;">Finplast v2.6</span>
        </div>

        <button type="submit" class="login-submit-btn" id="submitBtn">
          <span>Panələ Daxil Ol</span>
          <i data-lucide="arrow-right" style="width: 18px; height: 18px;"></i>
        </button>
      </form>
    </div>

    <div class="login-back">
      <a href="index.html">
        <i data-lucide="arrow-left" style="width: 16px; height: 16px;"></i>
        <span>Əsas Veb-Sayta Qayıt</span>
      </a>
    </div>
  </div>

  <script>
    // Check if already authenticated
    (function() {
      const isLoggedSession = sessionStorage.getItem('finplast_admin_logged') === 'true';
      const isLoggedLocal = localStorage.getItem('finplast_admin_logged') === 'true';
      if (isLoggedSession || isLoggedLocal) {
        window.location.href = 'admin.html';
      }
    })();

    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();

      const form = document.getElementById('loginForm');
      const userInp = document.getElementById('usernameInput');
      const passInp = document.getElementById('passwordInput');
      const rememberMe = document.getElementById('rememberMe');
      const alertBox = document.getElementById('loginAlert');
      const alertMsg = document.getElementById('loginAlertMsg');
      const togglePwdBtn = document.getElementById('togglePwdBtn');
      const eyeIcon = document.getElementById('eyeIcon');
      const submitBtn = document.getElementById('submitBtn');

      // Password toggle
      if (togglePwdBtn) {
        togglePwdBtn.addEventListener('click', () => {
          const isPass = passInp.type === 'password';
          passInp.type = isPass ? 'text' : 'password';
          eyeIcon.setAttribute('data-lucide', isPass ? 'eye-off' : 'eye');
          if (window.lucide) window.lucide.createIcons();
        });
      }

      // Handle Submit
      if (form) {
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const u = userInp.value.trim();
          const p = passInp.value.trim();

          try {
            await window.FinplastAPI.login(u, p);
            sessionStorage.setItem('finplast_admin_logged', 'true');
            if (rememberMe && rememberMe.checked) {
              localStorage.setItem('finplast_admin_logged', 'true');
            } else {
              localStorage.removeItem('finplast_admin_logged');
            }

            submitBtn.innerHTML = `<span>Giriş edilir...</span> <i data-lucide="check"></i>`;
            submitBtn.style.background = '#10b981';
            if (window.lucide) window.lucide.createIcons();

            setTimeout(() => {
              window.location.href = 'admin.html';
            }, 500);
          } catch (error) {
            alertBox.style.display = 'flex';
            alertMsg.textContent = 'İstifadəçi adı və ya şifrə yanlışdır!';
            passInp.value = '';
            passInp.focus();
          }
        });
      }
    });
  </script>
</body>
</html>
